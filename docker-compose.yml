# Entorno local completo: `docker compose up --build` y abre http://localhost:8080
# Las credenciales son de ejemplo y solo valen en local.
name: devpilot

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot
      POSTGRES_DB: devpilot
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devpilot -d devpilot']
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica las migraciones y termina. Usa la etapa de build, la única con la CLI de Prisma.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    command: npm run db:deploy -w @devpilot/api
    environment:
      DATABASE_URL: postgresql://devpilot:devpilot@db:5432/devpilot
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # development: en producción la API rechaza estas credenciales y secretos de ejemplo.
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://devpilot:devpilot@db:5432/devpilot
      JWT_ACCESS_SECRET: example-access-secret-change-me-0123456789
      JWT_REFRESH_SECRET: example-refresh-secret-change-me-012345678
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  db-data:
