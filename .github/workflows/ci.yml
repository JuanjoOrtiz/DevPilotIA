name: CI

on:
  pull_request:
  push:
    branches: [main, , develop]

# Una ejecución nueva de la misma rama cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devpilot
          POSTGRES_PASSWORD: devpilot
          POSTGRES_DB: devpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpilot -d devpilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://devpilot:devpilot@localhost:5432/devpilot_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint y formato (incluye la regla de dependencias entre capas)
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests unitarios y de la capa HTTP
        run: npm test

      - name: Migraciones sobre PostgreSQL
        run: npm run db:deploy

      - name: Tests de integración con PostgreSQL
        run: npm run test:integration

      - name: Build
        run: npm run build

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - run: docker build -f apps/api/Dockerfile -t devpilot-api:ci .
