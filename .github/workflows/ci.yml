name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Una ejecución nueva de la misma rama cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# SEG-18: solo lectura. Ningún job necesita escribir en el repositorio.
permissions:
  contents: read

# SEG-03: cada action va fijada al commit de su versión, no a una etiqueta que se puede
# mover. Dependabot propone las actualizaciones (.github/dependabot.yml).
jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devpilot
          POSTGRES_PASSWORD: devpilot
          POSTGRES_DB: devpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpilot -d devpilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://devpilot:devpilot@localhost:5432/devpilot_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Auditoría de dependencias (falla con vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high

      - name: Lint y formato (incluye la regla de dependencias entre capas)
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests unitarios y de la capa HTTP
        run: npm test

      - name: Migraciones sobre PostgreSQL
        run: npm run db:deploy

      - name: Tests de integración con PostgreSQL
        run: npm run test:integration

      - name: Build
        run: npm run build

  docs:
    name: OpenAPI y Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build -w @devpilot/shared

      # RNF-17: el documento sale de los esquemas Zod; los tests comprueban que es válido
      # y que cubre todas las rutas de app.ts.
      - name: Generar la especificación OpenAPI
        run: npm run openapi -w @devpilot/api -- ../../openapi.json

      # RNF-18: el catálogo de componentes compila con todas sus historias.
      - name: Build de Storybook
        run: npm run build-storybook -w @devpilot/web

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-docs-and-storybook
          path: |
            openapi.json
            apps/web/storybook-static
          retention-days: 14

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build -f apps/api/Dockerfile -t devpilot-api:ci .
