name: Deploy

# Producción sale siempre de `main`. Vercel compila y publica los dos proyectos al recibir
# el merge; este workflow se ocupa de lo que Vercel no hace:
#   1. Aplica las migraciones ANTES del merge, en cuanto se abre el pull request de
#      `develop` a `main`. Toda migración es compatible con la versión desplegada.
#   2. Tras el merge, vuelve a aplicarlas (no hace nada si ya están) y comprueba que
#      la API de producción ejecuta el código de este commit y que la página de inicio carga.
#      Vercel no vuelve a desplegar la API si el merge solo cambia la web: entonces /health
#      sigue dando un commit anterior, y vale si la API y `packages/shared` no cambian entre
#      ese commit y este.
# Sin el secreto DATABASE_URL o la variable PRODUCTION_URL, el paso correspondiente se salta.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migraciones en Supabase
    # Solo el pull request de release, nunca uno de una rama cualquiera ni de un fork.
    if: github.event_name == 'push' || github.head_ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Aplicar las migraciones pendientes
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Falta el secreto DATABASE_URL del entorno production: las migraciones no se han aplicado."
            exit 0
          fi
          npm run db:deploy

  verify:
    name: Comprobar producción
    if: github.event_name == 'push'
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      # Todo el historial: hace falta el commit que esté sirviendo producción para compararlo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Esperar a que la API de producción ejecute el código de este commit
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::Falta la variable PRODUCTION_URL del entorno production: no se comprueba el despliegue."
            exit 0
          fi
          for attempt in $(seq 1 40); do
            body=$(curl -fsS "$PRODUCTION_URL/api/v1/health" || true)
            echo "Intento $attempt: $body"
            version=$(echo "$body" | sed -n 's/.*"version":"\([0-9a-f]\{40\}\)".*/\1/p')
            if [ -n "$version" ] && echo "$body" | grep -q '"database":"up"'; then
              if [ "$version" = "$GITHUB_SHA" ]; then
                exit 0
              fi
              if git cat-file -e "$version^{commit}" 2>/dev/null \
                && git diff --quiet "$version" "$GITHUB_SHA" -- apps/api packages/shared; then
                echo "La API sigue en $version: este commit no cambia apps/api ni packages/shared."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::La API de producción no ejecuta el código del commit $GITHUB_SHA tras 10 minutos."
          exit 1

      - name: Comprobar la página de inicio
        if: env.PRODUCTION_URL != ''
        run: curl -fsS -o /dev/null -w "%{http_code}\n" "$PRODUCTION_URL/"
