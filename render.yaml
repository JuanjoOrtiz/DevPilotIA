# Blueprint de Render para la API. Pasos completos en docs/deployment.md.
services:
  - type: web
    name: devpilot-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Sin healthCheckPath a propósito: /api/v1/health responde 503 si la base de datos no
    # está disponible, y Render reiniciaría la API en bucle en vez de dejarla informar de ello.
    # Render despliega solo cuando el CI de GitHub ha pasado.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Cadena de conexión de Supabase (pooler en modo sesión). Se escribe en el panel de
      # Render al crear el servicio; nunca se guarda en el repositorio.
      - key: DATABASE_URL
        sync: false
